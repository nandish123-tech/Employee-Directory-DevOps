name: Continuous Integration

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x mvnw

      - name: Run Automated JUnit Tests
        run: ./mvnw -B test

      - name: Build Versioned JAR
        run: ./mvnw -B -DskipTests -Drevision=1.0.${{ github.run_number }}-gh clean package

      - name: Archive JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-directory-jar
          path: target/employee-directory-*.jar
