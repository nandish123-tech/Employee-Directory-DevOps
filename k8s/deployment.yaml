apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-directory
  labels:
    app: employee-directory
spec:
  replicas: 3
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: employee-directory
  template:
    metadata:
      labels:
        app: employee-directory
        tier: backend
    spec:
      containers:
        - name: employee-directory
          image: employee-directory:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          # Inject external configuration from ConfigMap
          envFrom:
            - configMapRef:
                name: employee-directory-config

          # Kubernetes Health Probes
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

          # Resource Management: Requests and Limits
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
